const cv = $('c'), ctx = cv.getContext('2d');
let W, H, GROUND, S;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.max(Math.min(H / 600, W / 500), 0.55);
  GROUND = H - 90 * S;
}
window.addEventListener('resize', resize); resize();

let best = 0; try { best = +localStorage.getItem('luong_best') || 0; } catch (e) {}

let state = 'menu', player, obstacles, coins, particles, clouds, hills, props, speed, dist, coinCount, spawnT, coinT, t, shake, flash, placeIdx, toast;
function reset() {
  player = { x: 110 * S, y: 0, vy: 0, jumps: 0, duck: false, run: 0, onGround: true, squash: 0 };
  obstacles = []; coins = []; particles = [];
  speed = 6.5; dist = 0; coinCount = 0; spawnT = 60; coinT = 120; t = 0; shake = 0; flash = 0;
  placeIdx = 0; toast = { text: PLACES[0][lang], life: 150 };
  props = []; for (let x = 0; x < W + 200; x += 260 * S) props.push(makeProp('beach', x + Math.random() * 80 * S));
}
function initScenery() {
  clouds = Array.from({ length: 6 }, () => ({ x: Math.random() * W, y: 40 + Math.random() * H * 0.25, s: 0.6 + Math.random() * 0.8 }));
  hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 260, h: 70 + Math.random() * 80, w: 260 + Math.random() * 120 }));
}
const zone = () => PLACES[placeIdx].zone;
function makeProp(z, x) {
  const w = { beach: 120, dragon: 620, hoian: 150, bana: 420, hue: 360, golf: 200 }[z] * S;
  return { z, x, w, seed: Math.random() };
}
initScenery(); reset();

// ---------- input ----------
function jump() {
  if (state !== 'play') return;
  if (player.jumps < 2) {
    player.vy = (player.jumps === 0 ? -15.5 : -13) * S;
    player.jumps++; player.onGround = false; player.duck = false;
    puff(player.x, GROUND, 6, '#e8d9b5');
  }
}
function duck(on) { if (state === 'play') { player.duck = on; if (on && !player.onGround) player.vy += 8 * S; } }
window.addEventListener('keydown', e => {
  if (!$('about').classList.contains('hidden')) { if (e.code === 'Escape') $('about').classList.add('hidden'); return; }
  if (['Space', 'ArrowUp', 'KeyW', 'ArrowDown', 'KeyS'].includes(e.code)) e.preventDefault();
  if (state !== 'play' && (e.code === 'Space' || e.code === 'Enter')) { if (state === 'menu' || overReady) start(); return; }
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') duck(true);
});
window.addEventListener('keyup', e => { if (e.code === 'ArrowDown' || e.code === 'KeyS') duck(false); });
let ty0 = null, swiped = false;
cv.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; swiped = false; }, { passive: true });
cv.addEventListener('touchmove', e => {
  if (ty0 !== null && e.touches[0].clientY - ty0 > 30 && !swiped) { swiped = true; duck(true); }
}, { passive: true });
cv.addEventListener('touchend', e => { e.preventDefault(); if (swiped) duck(false); else jump(); ty0 = null; });
cv.addEventListener('mousedown', jump);
$('btn').addEventListener('click', start);

let overReady = false;
function start() {
  reset(); state = 'play'; lastResult = null; overReady = false;
  $('panel').classList.add('hidden'); $('cta').classList.add('hidden'); $('lang').classList.add('hidden');
  $('btn').blur();
}

// ---------- spawning ----------
function spawn() {
  const lvl = Math.min(dist / 600, 1);
  const pool = lvl < 0.15 ? ['cone', 'box', 'puddle'] : lvl < 0.4 ? ['cone', 'box', 'barrier', 'bird', 'puddle']
    : ['cone', 'box', 'barrier', 'bike', 'bird', 'puddle', 'stack', zone() === 'golf' ? 'golfcart' : 'bike'];
  const type = pool[Math.floor(Math.random() * pool.length)];
  const o = { type, x: W + 40 * S, hit: false, f: 0 };
  switch (type) {
    case 'cone': o.w = 34; o.h = 46; break;
    case 'box': o.w = 50; o.h = 50; break;
    case 'stack': o.w = 50; o.h = 100; break;
    case 'barrier': o.w = 80; o.h = 56; break;
    case 'bike': o.w = 96; o.h = 64; o.extra = 2.5; break;
    case 'golfcart': o.w = 100; o.h = 70; o.extra = 1.5; break;
    case 'puddle': o.w = 90; o.h = 12; break;
    case 'bird': o.w = 50; o.h = 30; o.alt = Math.random() < 0.5 ? 78 : 140; o.extra = 1; break;
  }
  o.w *= S; o.h *= S;
  o.y = type === 'bird' ? GROUND - o.alt * S - o.h : GROUND - o.h;
  obstacles.push(o);
  if (type !== 'bird' && Math.random() < 0.5)
    for (let i = 0; i < 3; i++) coins.push({ x: o.x + o.w / 2 + (i - 1) * 34 * S, y: o.y - 60 * S - (1 - Math.abs(i - 1)) * 14 * S, a: 0 });
}
function spawnCoins() {
  const n = 4 + Math.floor(Math.random() * 4), high = Math.random() < 0.4;
  for (let i = 0; i < n; i++) coins.push({ x: W + 40 * S + i * 36 * S, y: GROUND - (high ? 150 : 40) * S - Math.sin(i / (n - 1) * Math.PI) * 40 * S, a: 0 });
}
function puff(x, y, n, col) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 4 - 2, vy: -Math.random() * 3, life: 30, col, r: (3 + Math.random() * 4) * S });
}

// ---------- hitbox ----------
function playerBox() {
  const ducking = player.duck && player.onGround;
  const h = (ducking ? 62 : 120) * S, w = (ducking ? 70 : 52) * S;
  return { x: player.x - w / 2 + 6 * S, y: GROUND + player.y - h + 4 * S, w: w - 12 * S, h: h - 8 * S };
}
function hitTest(a, o) {

// ---------- update ----------
function update() {
  t++;
  const sv = (state === 'play' ? speed : 2) * S;
  if (state === 'play') {
    speed = Math.min(6.5 + dist / 140, 16);
    dist += speed / 14;
    const v = speed * S;
    player.vy += 0.75 * S;
    player.y += player.vy;
    if (player.y >= 0) {
      if (!player.onGround) { player.squash = 1; puff(player.x, GROUND, 5, '#e8d9b5'); }
      player.y = 0; player.vy = 0; player.onGround = true; player.jumps = 0;
    }
    player.run += speed * 0.035;
    player.squash *= 0.85;

    if (placeIdx < PLACES.length - 1 && dist >= PLACES[placeIdx + 1].d) {
      placeIdx++; toast = { text: PLACES[placeIdx][lang], life: 150 };
    }
    if (--spawnT <= 0) { spawn(); spawnT = Math.max(38, 95 - dist / 12) + Math.random() * 55; }
    if (--coinT <= 0) { spawnCoins(); coinT = 140 + Math.random() * 160; }

    const pb = playerBox();
    for (const o of obstacles) {
      o.x -= v + (o.extra || 0) * S; o.f++;
      if (!o.hit && hitTest(pb, o)) { o.hit = true; gameOver(); }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -50);
    for (const c of coins) {
      c.x -= v; c.a += 0.12;
      if (!c.got && c.x > pb.x - 14 * S && c.x < pb.x + pb.w + 14 * S && c.y > pb.y - 14 * S && c.y < pb.y + pb.h + 14 * S) {
        c.got = true; coinCount++; dist += 5;
        for (let i = 0; i < 6; i++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - .5) * 6, vy: (Math.random() - .5) * 6, life: 22, col: '#ffd84a', r: 3 * S });
      }
    }
    coins = coins.filter(c => !c.got && c.x > -30);
    if (player.onGround && t % 6 === 0) puff(player.x - 14 * S, GROUND, 1, '#d8c7a0');
  }
  if (toast && toast.life > 0) toast.life--;
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const c of clouds) { c.x -= sv * 0.12 * c.s; if (c.x < -200) { c.x = W + 100; c.y = 40 + Math.random() * H * 0.25; } }
  for (const h of hills) h.x -= sv * 0.2;
  const hw = Math.max(...hills.map(h => h.x + h.w)); for (const h of hills) if (h.x + h.w < 0) { h.x = Math.max(hw, W); h.h = 70 + Math.random() * 80; }
  for (const p of props) p.x -= sv * 0.5;
  props = props.filter(p => p.x + p.w > -20);
  const right = props.length ? Math.max(...props.map(p => p.x + p.w)) : 0;
  const z = zone();
  if (right < W + 20) props.push(makeProp(z, Math.max(right, W - 10) + (z === 'dragon' ? 0 : (40 + Math.random() * 140) * S)));
  if (shake > 0) shake *= 0.88;
  if (flash > 0) flash -= 0.05;
  $('score').textContent = Math.floor(dist) + ' m';
  $('coins').textContent = '● ' + coinCount;
}

function showOver() {
  const L = T[lang], r = lastResult;
  $('title').textContent = r.isBest ? L.newBest : L.oops;
  $('msg').innerHTML = L.result(r.score, r.coins, PLACES[r.place][lang]);
  $('btn').textContent = L.again;
}
function gameOver() {
  state = 'over'; shake = 18 * S; flash = 1;
  puff(player.x, GROUND + player.y - 80 * S, 20, '#ff6b4a');
  const score = Math.floor(dist), isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('luong_best', best); } catch (e) {} }
  lastResult = { score, coins: coinCount, place: placeIdx, isBest };
  $('best').textContent = T[lang].best + ': ' + best + ' m';
  setTimeout(() => {
    showOver();
    $('cta').classList.remove('hidden'); $('lang').classList.remove('hidden');
    $('panel').classList.remove('hidden');
    setTimeout(() => overReady = true, 400);
  }, 650);
}

  if (dead) {
    ctx.fillStyle = '#ffd84a'; ctx.font = `${16 * S}px sans-serif`; ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) { const a = t * 0.12 + i * 2.1; ctx.fillText('★', hx + Math.cos(a) * hr * 1.1, hy - hr * 0.9 + Math.sin(a) * 8 * S); }
  }
  ctx.restore();
}

function drawCoin(c) {
  const sw = Math.abs(Math.cos(c.a)) * 11 * S + 2 * S;
  ctx.fillStyle = '#e6a800'; ctx.beginPath(); ctx.ellipse(c.x, c.y, sw, 12 * S, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(c.x, c.y, sw * 0.72, 9 * S, 0, 0, 7); ctx.fill();
}

function drawToast() {
  if (state !== 'play' || !toast || toast.life <= 0) return;
  const a = Math.min(1, toast.life / 30, (150 - toast.life) / 15);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `800 ${Math.round(26 * S)}px system-ui, "Segoe UI", "Malgun Gothic", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const txt = '📍 ' + toast.text, tw = ctx.measureText(txt).width + 40 * S, y = 90 * S;
  ctx.fillStyle = 'rgba(20,30,50,.75)'; rr(W / 2 - tw / 2, y - 24 * S, tw, 48 * S, 24 * S); ctx.fill();
  ctx.fillStyle = '#ffcc33'; ctx.fillText(txt, W / 2, y + 1);
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBG();
  coins.forEach(drawCoin);
  obstacles.forEach(drawObstacle);
  drawPlayer();
  for (const p of particles) { ctx.globalAlpha = Math.max(p.life / 30, 0); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawToast();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
applyLang();
requestAnimationFrame(loop);
</script>
</body>
</html>
